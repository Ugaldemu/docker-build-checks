name: Docker Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          call: check
